[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bip322-reports"
version = "0.1.0"
description = "Balance reports in which every coin is backed by a verified BIP-322 proof of control: periods, movements, reconciliation, HTML/CSV/PDF, on top of bip322-audit"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bip322-audit>=0.6,<1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8"]

[project.scripts]
bip322-reports = "bip322reports.cli:main"

[tool.setuptools.packages.find]
include = ["bip322reports*"]

[tool.setuptools.package-data]
bip322reports = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]
